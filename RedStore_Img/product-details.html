<!-------- product-details.html -------->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Details - RedStore</title>

	<link rel="stylesheet" href="style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

<!---------- Navbar ---------->
<div class="container">
	<div class="navbar">
		<div class="logo">
			<img src="images/logo.png" width="125px" alt="RedStore Logo">
		</div>

		<nav>
			<ul id="MenuItems">
				<li><a href="index.html">Home</a></li>
				<li><a href="product.html">Products</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="contact.html">Contact</a></li>
				<li><a href="account.html">Account</a></li>
			</ul>
		</nav>

		<a href="cart.html">
			<img src="images/cart.png" width="30px" height="30px" alt="Cart">
		</a>

		<img src="images/menu.png" class="menu-icon" alt="Menu" onclick="menutoggle()">
	</div>
</div>

<!---------- Single Product ---------->
<div class="small-container single-product">
	<div class="row">
		<div class="col-2">
			<img src="images/gallery-1.jpg" width="100%" id="ProductImg" alt="Product Image">

			<div class="small-img-row">
				<div class="small-img-col">
					<img src="images/gallery-1.jpg" width="100%" class="small-img">
				</div>
				<div class="small-img-col">
					<img src="images/gallery-2.jpg" width="100%" class="small-img">
				</div>
				<div class="small-img-col">
					<img src="images/gallery-3.jpg" width="100%" class="small-img">
				</div>
				<div class="small-img-col">
					<img src="images/gallery-4.jpg" width="100%" class="small-img">
				</div>
			</div>
		</div>

		<div class="col-2">
			<p>Home / T-Shirt</p>
			<h1 id="productName">Red Printed T-Shirt by HRX</h1>
			<h4 id="productPrice">$50</h4>

			<select id="productSize">
				<option value="">Select Size</option>
				<option>XXL</option>
				<option>XL</option>
				<option>Large</option>
				<option>Medium</option>
				<option>Small</option>
			</select>

			<input type="number" id="productQty" value="1" min="1">

			<button class="btn" onclick="addToCart()">Add To Cart</button>

			<h3>Product Details <i class="fa fa-indent"></i></h3>
			<p>
				Give your summer wardrobe a style upgrade with the HRX
				Men's Active T-Shirt. Team it with shorts for workouts
				or denims for casual outings.
			</p>
		</div>
	</div>
</div>

<!---------- Footer ---------->
<div class="footer">
	<div class="container">
		<hr>
		<p class="copyright">
			Copyright 2026 - Akshay Hegde
		</p>
	</div>
</div>

<!---------- JS: Menu Toggle ---------->
<script>
	var MenuItems = document.getElementById("MenuItems");
	MenuItems.style.maxHeight = "0px";

	function menutoggle() {
		MenuItems.style.maxHeight =
			MenuItems.style.maxHeight === "0px" ? "200px" : "0px";
	}
</script>

<!---------- JS: Product Gallery ---------->
<script>
	var ProductImg = document.getElementById("ProductImg");
	var SmallImg = document.getElementsByClassName("small-img");

	for (let i = 0; i < SmallImg.length; i++) {
		SmallImg[i].onclick = function () {
			ProductImg.src = SmallImg[i].src;
		};
	}
</script>

<!---------- JS: Add To Cart ---------->
<script>
	function addToCart() {
		let name = document.getElementById("productName").innerText;
		let price = document.getElementById("productPrice").innerText;
		let size = document.getElementById("productSize").value;
		let qty = document.getElementById("productQty").value;
		let image = document.getElementById("ProductImg").src;

		if (size === "") {
			alert("Please select a size");
			return;
		}

		let cartItem = {
			name: name,
			price: price,
			size: size,
			quantity: qty,
			image: image
		};

		let cart = JSON.parse(localStorage.getItem("cartItems")) || [];
		cart.push(cartItem);
		localStorage.setItem("cartItems", JSON.stringify(cart));

		alert("Product added to cart successfully!");
	}
</script>

</body>
</html>
